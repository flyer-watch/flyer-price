name: Flyer Release Gate vNext

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'data/products.csv'
      - 'data/products_publish.csv'
      - 'data/staging/products.csv'
      - 'preview/**'
      - 'docs/**'
      - 'requirements.txt'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install OCR and Chromium runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn chromium
          tesseract --version
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Distribution release gate
        env:
          OMP_THREAD_LIMIT: '1'
        run: python src/run_distribution_gates.py
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyer-vnext-release-reports
          path: |
            reports/DISTRIBUTION_RELEASE_GATE_vnext.json
            reports/final_display_gate_vnext.json
            reports/local_regressions_v1_9.json
          if-no-files-found: ignore
