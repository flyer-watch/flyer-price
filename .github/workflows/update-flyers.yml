name: Update flyer prices
on:
  workflow_dispatch:
  schedule:
    - cron: '20 * * * *' # hourly; unchanged issues exit after source fingerprint check
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install OCR and Chromium runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn chromium
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Safe automatic update
        env:
          OMP_THREAD_LIMIT: '1'
        run: python src/auto_update.py
      - name: Final display and DOM gate
        run: python src/final_display_gate.py
      - name: Commit only promoted artifacts
        run: |
          git config user.name 'flyer-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/products.csv data/products_publish.csv data/current_issue_manifest.json docs/data.js preview/data.js reports/final_display_gate_vnext.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update flyer prices'
          git push
